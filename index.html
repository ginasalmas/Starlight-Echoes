<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GO-EUN'S RECORD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Nanum+Pen+Script&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <canvas id="cosmic-canvas"></canvas>
  <div id="nebula-overlay"></div>

  <div id="title-text">고은의 기록</div>

  <div id="central-profile">
    <div class="profile-avatar-wrapper" id="avatar-wrapper">
      <img
        src="https://gbaike-image.cdn.bcebos.com/aa64034f78f0f736e636e6550555b319eac4139d/aa64034f78f0f736e636e6550555b319eac4139d_3_4?x-bce-process=image/format,f_auto"
        alt="Go-Eun" />
    </div>
    <div class="profile-name">우리의 안고은</div>
    <button id="open-modal-btn">글쓰기</button>
  </div>

  <!-- Stars container -->
  <div id="stars-container"></div>
  <div id="orbit-container"></div>

  <!-- Tooltip -->
  <div id="star-tooltip" class="hidden">
    <img id="tooltip-img" src="" alt="Memory" />
    <div id="tooltip-text"></div>
  </div>

  <!-- Modal -->
  <div id="message-modal-container" class="hidden">
    <div id="message-modal">
      <div class="modal-content-wrapper" id="modal-content">
        <div class="modal-left hidden" id="modal-left-panel">
          <div class="boarding-pass">
            <div class="bp-header">
              <div class="bp-line short"></div>
              <div class="bp-line long"></div>
            </div>
            <div class="bp-body">
              <img id="preview-image" src="" alt="Preview" />
              <div class="bp-barcode"></div>
            </div>
          </div>
        </div>
        <div class="modal-right">
          <textarea id="message-input" placeholder="Tulis pesan kenanganmu di sini..."></textarea>

          <button id="upload-trigger-btn" title="Upload Foto">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
          </button>
          <input type="file" id="photo-upload" accept="image/*" hidden />

          <button id="send-btn" title="Kirim">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
      </div>
      <div class="star-core hidden" id="modal-star-core"></div>
    </div>
  </div>

  <script type="module" src="/main.js"></script>
</body>

</html>
